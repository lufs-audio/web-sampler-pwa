# LUFS website-portability manifest (docs/infra/website-portability 01).
# Target-independent source of truth for build, output, routes, and domains.
# The host is a swappable adapter; nothing below is Cloudflare-specific.
schema_version: 1
site_id: lufs-web-sampler
canonical_url: https://sampler.lufs.audio
source:
  repository: lufs-audio/web-sampler-pwa
  production_ref: main
build:
  command: npm run ci        # precheck -> test -> build once -> fail-closed verify
  output_dir: packages/app/dist
  toolchain:
    node: "24"               # pinned in-repo via .nvmrc
    package_manager: "npm"
  lockfiles:
    - package-lock.json
runtime:
  kind: static
  index: index.html
  error_document: index.html
  # Single entry point; unknown paths fall back to index.html. Built with
  # Vite base './' so the same bytes run at any domain or subpath.
  spa_fallback: true
  max_asset_bytes: 26214400  # 25 MiB (lowest active host: Cloudflare Pages)
  pwa:
    installable: true
    offline: true            # app shell precached; recorded audio lives in OPFS
    manifest: /manifest.webmanifest
    service_worker: /sw.js
  # Cross-origin isolation is NOT required today (no SharedArrayBuffer / WASM
  # threads). If the core ever moves hot paths to threaded WASM, add
  # Cross-Origin-Opener-Policy: same-origin and
  # Cross-Origin-Embedder-Policy: require-corp to site/headers.yaml.
# Canonical route list lives in site/routes.txt — scripts/verify-artifact.mjs
# reads it directly so the manifest and the verifier can never drift apart.
routes:
  source: site/routes.txt
external_origins: []         # zero: type is self-hosted, no runtime API calls
domains:
  - sampler.lufs.audio
# Generated host adapters, rendered from site/*.yaml by scripts/render-adapters.py.
adapters:
  cloudflare_pages:
    headers: _headers
    redirects: _redirects    # SPA fallback rule
    deploy_branch: site
release:
  artifact_name: site.tar.gz
  retain: 20
verification:
  content_probe: /index.html
  content_marker: "sampler"
  smoke_timeout_seconds: 10
